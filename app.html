<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google" content="notranslate">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura AI — Studio App</title>
  
  <!-- Global Design System CSS -->
  <link rel="stylesheet" href="assets/css/global-design-system.css" />
  
  <style>
    body {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Studio App Layout */
    .app-sidebar {
      width: 260px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 1.25rem;
      gap: 1.5rem;
    }

    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-main);
    }

    .chat-header {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-msg {
      max-width: 75%;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .msg-user {
      align-self: flex-end;
      background: var(--text-primary);
      color: var(--bg-main);
      border-bottom-right-radius: 2px;
      font-weight: 500;
    }

    .msg-bot {
      align-self: flex-start;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-bottom-left-radius: 2px;
      box-shadow: var(--shadow-sm);
    }

    .chat-input-area {
      padding: 1.5rem 2rem;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      gap: 12px;
      background: var(--bg-surface);
    }

    .chat-input {
      flex: 1;
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .chat-input:focus {
      border-color: var(--border-focus);
    }

    .new-chat-btn {
      width: 100%;
      padding: 10px;
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      transition: border-color 0.2s ease;
    }

    .new-chat-btn:hover {
      border-color: var(--border-focus);
    }

    .sidebar-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-menu a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      transition: background 0.2s ease;
    }

    .sidebar-menu a:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="app-sidebar">
    <a href="index.html" class="logo">
      <span class="status-dot"></span>
      AURA AI
    </a>

    <button class="new-chat-btn" onclick="clearChat()">+ New Chat</button>

    <ul class="sidebar-menu">
      <li><a href="index.html">🏠 Home</a></li>
      <li><a href="play.html">🎛️ Playground</a></li>
      <li><a href="templates.html">💡 Prompts</a></li>
      <li><a href="docs.html">📚 Docs</a></li>
    </ul>
  </aside>

  <!-- Main Chat Workspace -->
  <main class="app-main">
    <header class="chat-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-weight: 600;">Groq LLaMA 3.3 70B</span>
        <span style="font-size: 0.8rem; color: var(--text-muted);">(Ultra-Fast)</span>
      </div>
      <a href="index.html" class="btn-primary" style="padding: 6px 14px; font-size: 0.82rem;">Back Home</a>
    </header>

    <div class="chat-body" id="chatContainer">
      <div class="chat-msg msg-bot">
        Hello! I'm your Aura AI assistant powered by Groq speed. How can I help you build today? 🚀
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="userInput" class="chat-input" placeholder="Ask anything or generate code..." onkeypress="handleKeyPress(event)" />
      <button onclick="sendMessage()" class="btn-primary">Send</button>
    </div>
  </main>

  <script>
    // URL pointing to our future Vercel Serverless Proxy
    const PROXY_URL = "/api/chat";

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const chat = document.getElementById("chatContainer");
      const text = input.value.trim();

      if (!text) return;

      // Render User Message
      chat.innerHTML += `<div class="chat-msg msg-user">${text}</div>`;
      input.value = "";
      chat.scrollTop = chat.scrollHeight;

      // Render Loading Bubble
      const loadingId = "bot-" + Date.now();
      chat.innerHTML += `<div class="chat-msg msg-bot" id="${loadingId}">Thinking...</div>`;
      chat.scrollTop = chat.scrollHeight;

      try {
        const response = await fetch(PROXY_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: text })
        });

        const data = await response.json();
        document.getElementById(loadingId).innerText = data.reply || "No response received.";
      } catch (err) {
        document.getElementById(loadingId).innerText = "Backend proxy not connected yet. Once we deploy /api/chat.js on Vercel, answers will appear live here!";
      }

      chat.scrollTop = chat.scrollHeight;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function clearChat() {
      document.getElementById("chatContainer").innerHTML = `
        <div class="chat-msg msg-bot">
          New session started. Ask me anything! 🚀
        </div>
      `;
    }
  </script>
</body>
</html>
